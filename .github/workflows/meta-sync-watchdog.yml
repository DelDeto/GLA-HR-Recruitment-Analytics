name: GLA HR — Independent Meta sync watchdog V1.1

on:
  workflow_dispatch:
  schedule:
    - cron: '10 2 * * *' # 09:10 Asia/Ho_Chi_Minh
    - cron: '10 5 * * *' # 12:10 Asia/Ho_Chi_Minh

permissions:
  contents: read

concurrency:
  group: gla-meta-ads-daily-sync
  cancel-in-progress: false
  queue: max

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      META_AD_ACCOUNT_IDS: ${{ secrets.META_AD_ACCOUNT_IDS }}
      META_API_VERSION: v27.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Check required secrets without exposing values
        shell: bash
        run: |
          missing=0
          for name in META_ACCESS_TOKEN META_AD_ACCOUNT_IDS GOOGLE_SHEET_ID GOOGLE_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"
      - name: Detect missing daily checkpoint and recover when required
        run: |
          # A successful checkpoint stops this run without calling Meta.
          # Otherwise perform a guarded 8-day (or wider outage-backfill) upsert.
          python -m src.meta_sync --days 8 --skip-if-synced --run-kind watchdog
