name: Validate GLA HR Meta integration

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 3 && 'gla-meta-ads-daily-sync' || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Select explicitly requested V2.4 read-only diagnostic
        id: v24_diagnostic
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 3 && github.head_ref == 'fix/sync-reliability-v24-20261117' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          V24_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          case "$(git log -1 --format=%s "$V24_HEAD_SHA")" in
            *"[v24-meta-dual-dry-run]"*) echo 'meta_dual=true' >> "$GITHUB_OUTPUT" ;;
            *"[v24-full-dry-run]"*) echo 'full=true' >> "$GITHUB_OUTPUT" ;;
            *"[v24-access]"*) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
            *) echo 'run=false' >> "$GITHUB_OUTPUT" ;;
          esac
      - name: V2.4 credentialed read-only access and source diagnostics
        if: steps.v24_diagnostic.outputs.run == 'true'
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_IDS: ${{ secrets.META_AD_ACCOUNT_IDS }}
          META_API_VERSION: v27.0
        run: python -m src.sync_access_check --scan-sources --read-meta
      - name: V2.4 first private installation and six-branch FULL DRY RUN
        if: steps.v24_diagnostic.outputs.full == 'true'
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_IDS: ${{ secrets.META_AD_ACCOUNT_IDS }}
          META_API_VERSION: v27.0
        run: python -m src.sync_deployment
      - name: Dual-workbook Meta native preflight (read-only)
        if: steps.v24_diagnostic.outputs.meta_dual == 'true'
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_IDS: ${{ secrets.META_AD_ACCOUNT_IDS }}
          META_API_VERSION: v27.0
        run: python -m src.meta_dual_sync --days 8 --dry-run
