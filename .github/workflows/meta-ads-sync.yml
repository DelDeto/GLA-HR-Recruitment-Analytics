name: GLA HR — Meta Ads daily sync V1.1

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days to refresh (1–90)'
        required: true
        default: '8'
        type: string
      dry_run:
        description: 'Read and compare, do not change Google Sheets'
        type: boolean
        default: true
      history_start:
        description: 'Optional explicit historical start YYYY-MM-DD (private staging only)'
        type: string
        default: ''
      history_end:
        description: 'Historical end YYYY-MM-DD'
        type: string
        default: ''
      history_account_hashes:
        description: 'SHA256 selectors of configured account IDs; no account IDs in public inputs'
        type: string
        default: ''
      expected_sheet_hash:
        description: 'SHA256 of the intended existing spreadsheet ID'
        type: string
        default: ''
  schedule:
    - cron: '15 0 * * *' # primary: 07:15 ICT
    - cron: '25 0 * * *' # automatic retry: 07:25 ICT
    - cron: '45 0 * * *' # automatic retry: 07:45 ICT
    - cron: '15 1 * * *' # automatic retry: 08:15 ICT

permissions:
  contents: read

concurrency:
  group: gla-meta-ads-daily-sync
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      META_AD_ACCOUNT_IDS: ${{ secrets.META_AD_ACCOUNT_IDS }}
      META_API_VERSION: v27.0
      META_SYNC_DAYS: 8
      RUN_DAYS: ${{ inputs.days || '8' }}
      RUN_DRY_RUN: ${{ inputs.dry_run || false }}
      SCHEDULE_CRON: ${{ github.event.schedule || '' }}
      HISTORY_START: ${{ inputs.history_start || '' }}
      HISTORY_END: ${{ inputs.history_end || '' }}
      HISTORY_ACCOUNT_HASHES: ${{ inputs.history_account_hashes || '' }}
      HISTORY_EXPECTED_SHEET_HASH: ${{ inputs.expected_sheet_hash || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Unit tests (no Meta/Google calls)
        run: pytest -q
      - name: Check required secrets
        run: |
          if [ -z "$META_ACCESS_TOKEN" ]; then
            echo 'Missing GitHub Actions Secret META_ACCESS_TOKEN' >&2; exit 1
          fi
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo 'Missing GitHub Actions Secret GOOGLE_SERVICE_ACCOUNT_JSON' >&2; exit 1
          fi
          if [ -z "$GOOGLE_SHEET_ID" ]; then
            echo 'Missing GitHub Actions Secret GOOGLE_SHEET_ID' >&2; exit 1
          fi
          if [ -z "$META_AD_ACCOUNT_IDS" ]; then
            echo 'Missing GitHub Actions Secret META_AD_ACCOUNT_IDS' >&2; exit 1
          fi
      - name: Direct Meta API to Google Sheet
        shell: bash
        run: |
          if [ -n "$HISTORY_START" ]; then
            HISTORY_ARGS=(--start-date "$HISTORY_START" --end-date "$HISTORY_END" --account-hashes "$HISTORY_ACCOUNT_HASHES" --expected-sheet-hash "$HISTORY_EXPECTED_SHEET_HASH")
            if [ "$RUN_DRY_RUN" = 'true' ]; then HISTORY_ARGS+=(--dry-run); fi
            python -m src.meta_history "${HISTORY_ARGS[@]}"
            exit 0
          fi
          if ! [[ "$RUN_DAYS" =~ ^[0-9]+$ ]]; then echo 'Days must be numeric' >&2; exit 1; fi
          ARGS=(--days "$RUN_DAYS")
          if [ "$RUN_DRY_RUN" = 'true' ]; then ARGS+=(--dry-run); fi
          if [ "$GITHUB_EVENT_NAME" = 'schedule' ]; then
            if [ "$SCHEDULE_CRON" = '15 0 * * *' ]; then
              ARGS+=(--run-kind daily)
            else
              ARGS+=(--skip-if-synced --run-kind retry)
            fi
          else
            ARGS+=(--run-kind manual)
          fi
          python -m src.meta_sync "${ARGS[@]}"
