name: GLA HR — V1.1 one-time acceptance verification

on:
  push:
    paths:
      - '.github/workflows/v1-1-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: gla-meta-ads-daily-sync
  cancel-in-progress: false
  queue: max

jobs:
  acceptance:
    if: "${{ github.event.head_commit.message == 'ops: validate Meta V1.1 production + watchdog' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      META_AD_ACCOUNT_IDS: ${{ secrets.META_AD_ACCOUNT_IDS }}
      META_API_VERSION: v27.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Local unit tests
        run: pytest -q
      - name: Run a controlled V1.1 production upsert and create private success checkpoint
        run: python -m src.meta_sync --days 8 --run-kind manual
      - name: Assert same-day watchdog would skip duplicate sync
        run: python -m src.meta_sync --days 8 --skip-if-synced --run-kind watchdog
