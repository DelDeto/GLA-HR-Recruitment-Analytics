name: GLA HR — Verify Meta & Google connection (read-only)

on:
  push:
    paths:
      - '.github/workflows/connection-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gla-meta-connection-check
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_AD_ACCOUNT_IDS: ${{ secrets.META_AD_ACCOUNT_IDS }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      META_API_VERSION: v27.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check required Secrets without exposing values
        shell: bash
        run: |
          missing=0
          for name in META_ACCESS_TOKEN META_AD_ACCOUNT_IDS GOOGLE_SHEET_ID GOOGLE_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"
      - name: Verify live Meta API and Google Sheets read access (DRY RUN)
        run: python -m src.meta_sync --days 8 --dry-run
